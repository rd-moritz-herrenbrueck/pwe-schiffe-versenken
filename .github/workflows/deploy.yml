name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bereits gebautes Image-Tag erneut ausrollen (Rollback), z. B. v1.2.0'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.component }}
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Image-Präfix bestimmen (GHCR verlangt Kleinbuchstaben)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy auf IONOS-VPS
    needs: images
    # Bei workflow_dispatch (Rollback) sind ci/images übersprungen, das ist kein Fehler.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/schiffeversenken' }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH-Zugang einrichten
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Compose-Datei und .env übertragen
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_PORT: ${{ vars.APP_PORT || '8081' }}
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          scp docker-compose.prod.yml "vps:$DEPLOY_PATH/docker-compose.yml"
          # Secrets über stdin, damit sie nicht in der Prozessliste des Servers auftauchen.
          ssh vps "umask 077 && cat > '$DEPLOY_PATH/.env'" <<ENV
          IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}
          IMAGE_TAG=$IMAGE_TAG
          APP_PORT=$APP_PORT
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          ENV

      - name: Images ziehen und Stack starten
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vps "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans --wait --wait-timeout 180"
          ssh vps "docker image prune -f"

      - name: Registry-Login auf dem VPS entfernen
        if: always()
        run: ssh vps "docker logout ghcr.io" || true

      - name: Smoke-Test über die Domain
        run: curl -fsS --retry 10 --retry-delay 5 --retry-all-errors -o /dev/null "https://${{ vars.APP_DOMAIN }}/"
