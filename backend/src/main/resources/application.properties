# --- Datenbank ---
# dev: Datenbank aus docker-compose.yml (`docker compose up -d db`)
# test: Quarkus Dev Services (Testcontainers, Docker erforderlich)
# prod: Verbindung über QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/schiffe
%dev.quarkus.datasource.username=schiffe
%dev.quarkus.datasource.password=schiffe

# Schema ausschließlich über Flyway-Migrationen (db/migration), Hibernate erzeugt nichts.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# --- Spiel ---
# Nicht beendete Spiele ohne Aktivität werden nach dieser Frist als ABANDONED markiert (ISO-8601-Dauer).
game.abandon.inactive-after=P7D
# Prüfintervall des Jobs; im Testprofil aus, Tests rufen den Service direkt auf.
game.abandon.check-interval=1h
%test.game.abandon.check-interval=off

# --- SSE ---
# Abstand der HEARTBEAT-Ereignisse; hält Verbindungen hinter Proxys offen und lässt Clients tote Streams erkennen.
game.sse.heartbeat-interval=15s
%test.game.sse.heartbeat-interval=300ms

# --- KI-Gegner ---
# Fester Seed nur im Testprofil: Gleiche Eingaben des Menschen ergeben gleiche Flotten und Schüsse der KI,
# unabhängig von Spiel-ID und Reihenfolge der Spiele. Ohne Seed (dev/prod) entscheidet der Zufall.
%test.game.ai.seed=42
