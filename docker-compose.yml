# Gesamter Stack: `docker compose up --build` (Frontend unter http://localhost:8081)
# Nur die Datenbank für die lokale Entwicklung: `docker compose up -d db`
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schiffe}
      POSTGRES_USER: ${POSTGRES_USER:-schiffe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schiffe}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-schiffe}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-schiffe}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-schiffe}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 6

volumes:
  db-data:
