# Lokale Entwicklung: `docker compose up -d db`
# Backend- und Frontend-Dienste folgen in Phase 7 (siehe docs/todo.md).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schiffe}
      POSTGRES_USER: ${POSTGRES_USER:-schiffe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schiffe}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
